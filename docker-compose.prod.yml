# Продакшн-надстройка: HTTPS + автопродление сертификата.
# Запуск: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Первый раз сначала выполните: bash scripts/init-https.sh

services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # тот же путь в контейнере -> заменяет default.conf из базового файла
      - ./nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    # каждые 6 часов перечитываем сертификат (IP-сертификат живёт 6 дней)
    command: /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g "daemon off;"'

  certbot:
    image: certbot/certbot:v5.8.0
    restart: unless-stopped
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    # каждые 12 часов проверяем; certbot сам решает, пора ли продлевать
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
