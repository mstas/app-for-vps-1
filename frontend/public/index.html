<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Notes</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Заметки</h1>
    <p id="status" class="status">Проверка API…</p>

    <form id="form">
      <input id="text" placeholder="Новая заметка" autocomplete="off" required>
      <button type="submit">Добавить</button>
    </form>

    <ul id="list"></ul>
    <p id="empty" class="muted" hidden>Пока нет заметок.</p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
